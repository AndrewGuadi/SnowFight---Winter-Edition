name: SnowFight foundation checks
on:
  pull_request:
  push:
    branches:
      - docs/rebuild-reuse-first-2026-10-30
jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm install --prefix backend --no-save --package-lock=false playwright
      - run: cd backend && npx playwright install --with-deps chromium
      - run: node backend/tests/foundation-browser.cjs
      - run: node backend/tests/browser-smoke.cjs
      - run: node backend/tests/mission-browser.cjs
      - run: node backend/tests/recruits-browser.cjs
